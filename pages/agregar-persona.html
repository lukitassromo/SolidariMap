<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agregar Persona - SolidariMap</title>
  <link rel="stylesheet" href="../public/css/styles.css" />
  <link rel="stylesheet" href="../public/css/agregar-persona.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
    <nav>
      <div class="nav-container">
        <button id="toggleMenu" class="menu-btn"><i class="fas fa-bars"></i></button>
        <ul id="menuNav" class="menu">
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="quiero-ayudar.html">Quiero Ayudar</a></li>
          <li><a href="agregar-persona.html">Agregar Persona</a></li>
          <li><a href="comunidad.html" id="link-comunidades">Mis Comunidades</a></li>
          <li>
            <a href="iniciar-sesion.html" id="link-login">
              <span id="login-text">Iniciar Sesión</span>
            </a>
          </li>
          <li><a href="mi-cuenta.html">Mi Cuenta</a></li>
        </ul>
      </div>
    </nav>
  </header>    
  
  <main>
    <section>
      <h1>Agregar Persona en Situación de Calle</h1>
      <form id="agregar-persona-form">
        <label for="nombre">Nombre o Apodo:</label>
        <input type="text" id="nombre" required />

        <label for="edad">Edad Aproximada:</label>
        <input type="number" id="edad" required />

        <label for="detalles">Detalles Adicionales:</label>
        <textarea id="detalles" required></textarea>

        <label for="horario">Horario en que se encuentra:</label>
        <select id="horario" required>
          <option value="todo-el-dia">Todo el día</option>
          <option value="manana">Mañana</option>
          <option value="noche">Noche</option>
          <option value="ocasionalmente">Ocasionalmente</option>
        </select>

        <div class="search-container">
          <input type="text" id="searchInput" placeholder="Buscar dirección" />
          <button type="button" id="searchButton" class="btn-naranja">Buscar</button>
        </div>

        <div id="map" style="height: 300px; margin-bottom: 10px;"></div>
        <button type="button" id="locationButton" class="btn-naranja">Mi Ubicación</button>

        <button type="submit" class="btn-accion">Enviar</button>
      </form>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="../public/js/agregar-persona.js"></script>
  <script src="../public/js/script.js"></script> <!-- ✅ Este es el que maneja el menú -->
</body>
</html>
