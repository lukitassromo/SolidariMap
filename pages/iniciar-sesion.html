<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión - SolidariMap</title>
  <link rel="stylesheet" href="../public/css/styles.css" />
  <link rel="stylesheet" href="../public/css/iniciar-sesion.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
    <nav>
      <div class="nav-container">
        <button id="toggleMenu" class="menu-btn"><i class="fas fa-bars"></i></button>
        <ul id="menuNav" class="menu">
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="quiero-ayudar.html">Quiero Ayudar</a></li>
          <li><a href="agregar-persona.html">Agregar Persona</a></li>
          <li><a href="comunidad.html" id="link-comunidades">Mis Comunidades</a></li>
          <li>
            <a href="iniciar-sesion.html" id="link-login">
              <span id="login-text">Iniciar Sesión</span>
            </a>
          </li>
          <li><a href="mi-cuenta.html">Mi Cuenta</a></li>
        </ul>
      </div>
    </nav>
  </header>    

  <main>
    <div class="main-container">
      <h1>Iniciar Sesión</h1>
      <img src="../public/img/logo.png" alt="Logo SolidariMap" class="logo-login" />
      <form id="form-login">
        <input type="email" id="email" placeholder="Correo Electrónico" required />
        <input type="password" id="password" placeholder="Contraseña" required />

        <label style="display: inline-block; margin: 10px 0;">
          <input type="checkbox" id="recordarme">
          Mantener sesión iniciada
        </label>

        <button type="submit" class="btn-naranja">Iniciar Sesión</button>
        <p><a href="registro.html">¿No tienes cuenta? Regístrate</a></p>
      </form>
    </div>
  </main>  

  <script src="../public/js/iniciar-sesion.js"></script>
  <script src="../public/js/script.js"></script>
</body>
</html>
