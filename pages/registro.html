<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - SolidariMap</title>
  <link rel="stylesheet" href="../public/css/styles.css">
  <link rel="stylesheet" href="../public/css/registro.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
    <nav>
      <div class="nav-container">
        <button id="toggleMenu" class="menu-btn"><i class="fas fa-bars"></i></button>
        <ul id="menuNav" class="menu">
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="quiero-ayudar.html">Quiero Ayudar</a></li>
          <li><a href="agregar-persona.html">Agregar Persona</a></li>
          <li><a href="comunidad.html" id="link-comunidades">Mis Comunidades</a></li>
          <li>
            <a href="iniciar-sesion.html" id="link-login">
              <span id="login-text">Iniciar Sesión</span>
            </a>
          </li>
          <li><a href="mi-cuenta.html">Mi Cuenta</a></li>
        </ul>
      </div>
    </nav>
  </header>    

  <main class="main-container">
    <h1>REGISTRARME</h1>
    <form id="registerForm">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required>

      <label for="confirmPassword">Confirmar Contraseña:</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required>

      <button type="button" class="btn-naranja" id="enviarCodigoBtn">Enviar código</button>

      <div id="codigoSection" style="display: none;">
        <label for="codigo">Código de verificación (6 dígitos):</label>
        <input type="text" id="codigo" name="codigo" maxlength="6">
        <button type="submit" class="btn-naranja">Verificar y crear cuenta</button>
      </div>
    </form>
  </main>

  <script src="../public/js/registro.js"></script>
  <script src="../public/js/script.js"></script>
</body>
</html>
